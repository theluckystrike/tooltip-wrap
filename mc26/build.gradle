plugins { id 'net.fabricmc.fabric-loom' }
base { archivesName = 'tooltip-wrap-fabric' }
version = "${project.mod_version}+26.x"
sourceSets.main.java.srcDir '../common/src/main/java'
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'tooltip-wrap-test'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API is only used by the client game test source set, the mod itself does not need it
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
	def v = project.version
	inputs.property 'version', v
	filesMatching('fabric.mod.json') { expand 'version': v }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { from(rootProject.file('LICENSE')) { rename { "${it}_tooltip-wrap" } } }
